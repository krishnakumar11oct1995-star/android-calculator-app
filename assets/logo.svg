<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1123"/>
      <stop offset="100%" stop-color="#1a1c3b"/>
    </linearGradient>
    <linearGradient id="indigoViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="100" fill="url(#bg)"/>
  <rect x="25" y="25" width="450" height="450" rx="85" fill="none" stroke="#25284f" stroke-width="3"/>
  <!-- Top Left: Plus (+) -->
  <rect x="110" y="110" width="115" height="115" rx="28" fill="#1e2246"/>
  <path d="M 167 140 L 167 195 M 140 167 L 195 167" stroke="#818CF8" stroke-width="12" stroke-linecap="round"/>
  <!-- Top Right: Minus (−) -->
  <rect x="275" y="110" width="115" height="115" rx="28" fill="#1e2246"/>
  <path d="M 305 167 L 360 167" stroke="#818CF8" stroke-width="12" stroke-linecap="round"/>
  <!-- Bottom Left: Multiply (×) -->
  <rect x="110" y="275" width="115" height="115" rx="28" fill="#1e2246"/>
  <path d="M 148 313 L 187 352 M 187 313 L 148 352" stroke="#818CF8" stroke-width="12" stroke-linecap="round"/>
  <!-- Bottom Right: Equal (=) -->
  <rect x="275" y="275" width="115" height="115" rx="28" fill="url(#accentOrange)" filter="url(#glow)"/>
  <path d="M 305 322 L 360 322 M 305 344 L 360 344" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
</svg>
